name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Integration Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          odin version
          wasmer --version

      - name: Test Native Odin CLI Tool
        run: |
          odin build cmd/odin-wasix -out:odin-wasix-native
          ./odin-wasix-native version

      - name: Run odin-wasix Integration Test Suite (Zero-Dependency Bash)
        run: |
          ./odin-wasix test
